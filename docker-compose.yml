services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autoscoring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoscoring}
      POSTGRES_DB: ${POSTGRES_DB:-autoscoring}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoscoring}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    user: root
    build: ./backend
    ports:
      - "8000:7860"
    environment:
      PORT: 7860
      DATABASE_URL: ${DATABASE_URL:-postgresql://autoscoring:autoscoring@db:5432/autoscoring}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:-fyp-autoscoring-secret-change-in-production}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-uploads}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache/huggingface
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  model_cache:
  uploads_data:
